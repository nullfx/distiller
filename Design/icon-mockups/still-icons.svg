<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="2400" height="1900" viewBox="0 0 2400 1900">
  <defs>
    <!-- Shared paints -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eceef1"/>
    </linearGradient>
    <radialGradient id="copperBulb" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffd3a1"/>
      <stop offset="0.18" stop-color="#e9995a"/>
      <stop offset="0.55" stop-color="#b8682d"/>
      <stop offset="1" stop-color="#6e3714"/>
    </radialGradient>
    <linearGradient id="copperTube" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a3d17"/><stop offset="0.3" stop-color="#e8a063"/>
      <stop offset="0.55" stop-color="#c0743a"/><stop offset="1" stop-color="#6a3313"/>
    </linearGradient>
    <linearGradient id="copperBell" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e3714"/><stop offset="0.28" stop-color="#e6995b"/>
      <stop offset="0.42" stop-color="#ffcf9a"/><stop offset="0.6" stop-color="#c47838"/>
      <stop offset="1" stop-color="#5e2d10"/>
    </linearGradient>
    <radialGradient id="doorHole" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#2a140a"/><stop offset="1" stop-color="#4a2410"/>
    </radialGradient>
    <radialGradient id="fire" cx="0.5" cy="0.8" r="0.7">
      <stop offset="0" stop-color="#ffe08a"/><stop offset="0.45" stop-color="#ff8a2a"/><stop offset="1" stop-color="#7a1f08"/>
    </radialGradient>
    <clipPath id="squircle"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>

    <!-- A: pot still with condenser -->
    <symbol id="iconA" viewBox="0 0 1024 1024">
      <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" stroke="#c9ccd1" stroke-width="3"/>
      <g clip-path="url(#squircle)">
        <!-- lyne arm: from neck top arching to condenser -->
        <path d="M402 300 C 470 230, 600 250, 690 360" fill="none" stroke="#5a2a0f" stroke-width="44" stroke-linecap="round"/>
        <path d="M402 300 C 470 230, 600 250, 690 360" fill="none" stroke="url(#copperTube)" stroke-width="30" stroke-linecap="round"/>
        <!-- condenser (worm tub) -->
        <rect x="640" y="380" width="150" height="330" rx="30" fill="url(#copperTube)" stroke="#5a2a0f" stroke-width="8"/>
        <g stroke="#7a3d17" stroke-width="10" opacity="0.8">
          <line x1="648" y1="450" x2="782" y2="450"/><line x1="648" y1="545" x2="782" y2="545"/><line x1="648" y1="640" x2="782" y2="640"/>
        </g>
        <path d="M715 710 L 715 760 L 760 760" fill="none" stroke="url(#copperTube)" stroke-width="22" stroke-linecap="round"/>
        <!-- neck -->
        <path d="M372 470 L 382 300 L 422 300 L 432 470 Z" fill="url(#copperTube)" stroke="#5a2a0f" stroke-width="8"/>
        <!-- belly -->
        <circle cx="402" cy="610" r="215" fill="url(#copperBulb)" stroke="#5a2a0f" stroke-width="10"/>
        <!-- mash door -->
        <circle cx="402" cy="640" r="62" fill="url(#doorHole)" stroke="#f0b07a" stroke-width="14"/>
        <!-- base -->
        <rect x="230" y="800" width="344" height="40" rx="14" fill="#3b2a22"/>
      </g>
    </symbol>

    <!-- B: just the still, bigger -->
    <symbol id="iconB" viewBox="0 0 1024 1024">
      <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" stroke="#c9ccd1" stroke-width="3"/>
      <g clip-path="url(#squircle)">
        <!-- swan neck curving right -->
        <path d="M512 290 C 560 200, 700 200, 760 300" fill="none" stroke="#5a2a0f" stroke-width="52" stroke-linecap="round"/>
        <path d="M512 290 C 560 200, 700 200, 760 300" fill="none" stroke="url(#copperTube)" stroke-width="36" stroke-linecap="round"/>
        <path d="M470 440 L 486 290 L 538 290 L 554 440 Z" fill="url(#copperTube)" stroke="#5a2a0f" stroke-width="8"/>
        <circle cx="512" cy="600" r="265" fill="url(#copperBulb)" stroke="#5a2a0f" stroke-width="12"/>
        <circle cx="512" cy="630" r="80" fill="url(#doorHole)" stroke="#f0b07a" stroke-width="18"/>
        <rect x="320" y="850" width="384" height="44" rx="16" fill="#3b2a22"/>
      </g>
    </symbol>

    <!-- C: wide bell still, top out of frame, round mash door, small fire -->
    <symbol id="iconC" viewBox="0 0 1024 1024">
      <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" stroke="#c9ccd1" stroke-width="3"/>
      <g clip-path="url(#squircle)">
        <!-- bell rising past the top edge -->
        <path d="M200 760 C 200 560, 330 420, 400 60 L 624 60 C 694 420, 824 560, 824 760 Z" fill="url(#copperBell)" stroke="#5a2a0f" stroke-width="12"/>
        <!-- seam band and rivets -->
        <path d="M232 640 C 420 610, 604 610, 792 640" fill="none" stroke="#7a3d17" stroke-width="10" opacity="0.7"/>
        <g fill="#ffd9ae" opacity="0.8">
          <circle cx="300" cy="628" r="9"/><circle cx="400" cy="618" r="9"/><circle cx="512" cy="615" r="9"/>
          <circle cx="624" cy="618" r="9"/><circle cx="724" cy="628" r="9"/>
        </g>
        <!-- round mash door on the front -->
        <circle cx="512" cy="470" r="105" fill="url(#doorHole)" stroke="#f3b783" stroke-width="22"/>
        <circle cx="512" cy="470" r="128" fill="none" stroke="#7a3d17" stroke-width="8" opacity="0.8"/>
        <!-- brick firebox with fire -->
        <rect x="170" y="760" width="684" height="170" fill="#5a2e22"/>
        <g stroke="#3a1d15" stroke-width="6"><line x1="170" y1="815" x2="854" y2="815"/><line x1="170" y1="870" x2="854" y2="870"/></g>
        <path d="M420 930 L 420 845 Q 512 790 604 845 L 604 930 Z" fill="url(#fire)"/>
      </g>
    </symbol>
  </defs>

  <rect width="2400" height="1900" fill="#ffffff"/>
  <g font-family="-apple-system, Helvetica, Arial" font-size="40" fill="#222">
    <text x="60" y="80">A · pot still + condenser</text>
    <text x="860" y="80">B · just the still</text>
    <text x="1660" y="80">C · bell still with mash door</text>
  </g>
  <!-- large -->
  <use xlink:href="#iconA" x="40" y="110" width="680" height="680"/>
  <use xlink:href="#iconB" x="840" y="110" width="680" height="680"/>
  <use xlink:href="#iconC" x="1640" y="110" width="680" height="680"/>
  <!-- real sizes: 128, 64, 32, 16 -->
  <g font-family="-apple-system, Helvetica, Arial" font-size="26" fill="#555">
    <text x="60" y="860">128 · 64 · 32 · 16 pt</text><text x="860" y="860">128 · 64 · 32 · 16 pt</text><text x="1660" y="860">128 · 64 · 32 · 16 pt</text>
  </g>
  <g>
    <use xlink:href="#iconA" x="60" y="890" width="128" height="128"/><use xlink:href="#iconA" x="210" y="922" width="64" height="64"/>
    <use xlink:href="#iconA" x="296" y="938" width="32" height="32"/><use xlink:href="#iconA" x="350" y="946" width="16" height="16"/>
    <use xlink:href="#iconB" x="860" y="890" width="128" height="128"/><use xlink:href="#iconB" x="1010" y="922" width="64" height="64"/>
    <use xlink:href="#iconB" x="1096" y="938" width="32" height="32"/><use xlink:href="#iconB" x="1150" y="946" width="16" height="16"/>
    <use xlink:href="#iconC" x="1660" y="890" width="128" height="128"/><use xlink:href="#iconC" x="1810" y="922" width="64" height="64"/>
    <use xlink:href="#iconC" x="1896" y="938" width="32" height="32"/><use xlink:href="#iconC" x="1950" y="946" width="16" height="16"/>
  </g>
  <!-- in a dark Dock -->
  <rect x="40" y="1080" width="2320" height="380" rx="40" fill="#1e1e1e"/>
  <g font-family="-apple-system, Helvetica, Arial" font-size="26" fill="#bbb"><text x="70" y="1125">In a dark Dock (128 pt)</text></g>
  <use xlink:href="#iconA" x="300" y="1170" width="256" height="256"/>
  <use xlink:href="#iconB" x="1072" y="1170" width="256" height="256"/>
  <use xlink:href="#iconC" x="1844" y="1170" width="256" height="256"/>
  <!-- in a light Dock -->
  <rect x="40" y="1480" width="2320" height="380" rx="40" fill="#e6e6e8"/>
  <g font-family="-apple-system, Helvetica, Arial" font-size="26" fill="#555"><text x="70" y="1525">In a light Dock (128 pt)</text></g>
  <use xlink:href="#iconA" x="300" y="1570" width="256" height="256"/>
  <use xlink:href="#iconB" x="1072" y="1570" width="256" height="256"/>
  <use xlink:href="#iconC" x="1844" y="1570" width="256" height="256"/>
</svg>
