<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- The website's link preview (og:image): the app's window beside the name and tagline.
       Render with Scripts/make-social-card.sh after changing it or site/assets/app-library.png. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf8f5"/><stop offset="1" stop-color="#f3e6da"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <image x="72" y="150" width="64" height="64" xlink:href="../site/assets/icon.png"/>
  <text x="152" y="198" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#22201e">Distiller</text>
  <text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#22201e">
    <tspan x="72" y="300">Windows games</tspan><tspan x="72" y="350">on your Mac,</tspan>
    <tspan x="72" y="400">distilled into recipes.</tspan>
  </text>
  <text font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="22" fill="#6b625b">
    <tspan x="72" y="462">Free and open source, for Apple silicon.</tspan>
  </text>
  <image x="478" y="88" width="700" height="467" xlink:href="../site/assets/app-library.png"/>
</svg>
