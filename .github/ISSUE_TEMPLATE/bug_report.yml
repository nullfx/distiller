name: Bug report
description: Something in the Distiller app, the distiller command or the website doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a game that doesn't run, use [distiller-recipes](https://github.com/nullfx/distiller-recipes) instead, unless Distiller itself is at fault (a crash, a wrong error, a setting that isn't applied). For anything security-related, see [SECURITY.md](https://github.com/nullfx/distiller/blob/main/SECURITY.md) and don't post it here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Include the exact text of any error message.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Community and choose …
        2. Click Install…
        3. …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - The app
        - The distiller command
        - Installing or launching a game (Wine, graphics layers, bottles)
        - Creating, checking or submitting a recipe
        - The AI assistant (distiller mcp)
        - The website
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Distiller version
      description: Distiller ▸ About Distiller, or `distiller --version`. For a build from source, the commit.
      placeholder: "1.0.3"
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac and macOS version
      description: The chip, memory and macOS version are enough. Distiller shows them at the bottom of its sidebar.
      placeholder: Apple M3 Pro · 36 GB · macOS 27.2
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        If it's about a game, the relevant part of its launch log (right-click the game ▸ Show Log). Remove anything personal first, such as your user name in paths.
      render: text
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, the recipe you used, or what you've already tried.
