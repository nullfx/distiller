name: Bug report
description: Something in the Distiller app, the distiller command or the website doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. This repository is for the Distiller app itself: the app, the `distiller` command and the website.

        **A game that doesn't run, or runs badly on your Mac**, belongs in [distiller-recipes](https://github.com/nullfx/distiller-recipes), which collects recipes and how they run on different hardware (in the app: right-click the game ▸ Report How It Ran…). Report it here only if Distiller itself is at fault: it crashes, shows a wrong error, or doesn't apply a recipe's settings.

        For anything security-related, see [SECURITY.md](https://github.com/nullfx/distiller/blob/main/SECURITY.md) and don't post it here.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Include the exact text of any error message.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Community and choose …
        2. Click Install…
        3. …
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - The app
        - The distiller command
        - Installing, setting up or launching games (Distiller's part, not the game's)
        - Creating, checking or submitting a recipe
        - The AI assistant (distiller mcp)
        - The website
        - Not sure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Distiller version
      description: Distiller ▸ About Distiller, or `distiller --version`. For a build from source, the commit.
      placeholder: "1.0.3"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.1
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Any error text, or the part of a launch log that shows Distiller's error (right-click the game ▸ Show Log). Remove anything personal first, such as your user name in paths.
      render: text
  - type: textarea
    id: more
    attributes:
      label: Anything else
      description: Screenshots, or what you've already tried.
