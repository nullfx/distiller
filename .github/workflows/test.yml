name: Test

# Builds the package and runs the unit tests on every pull request and on main.
# The ruleset on main requires this workflow's "test" job to pass.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          sw_vers
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Test the website's scripts
        run: node --test site/tests/*.test.mjs
