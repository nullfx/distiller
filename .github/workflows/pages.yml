name: Website

# Publishes site/ to GitHub Pages (https://nullfx.github.io/distiller/) when it changes on main.
# The site reads the catalogue from distiller-recipes' Pages at run time, so merging a recipe
# there doesn't need a rebuild here.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test the site's scripts
        run: node --test site/tests/*.test.mjs
      - name: Version asset links
        # Browsers keep Pages files for 10 minutes and modules import each other by name, so a
        # visitor could otherwise mix old and new scripts after a deployment. Every .js and .css
        # reference in the published copy (HTML tags and module imports) gets ?v=<commit>.
        run: |
          for file in $(find site -path site/tests -prune -o \( -name '*.html' -o -name '*.js' \) -print); do
            sed -i -E "s#(\.(js|css))\"#\1?v=${GITHUB_SHA::12}\"#g" "$file"
          done
          grep -rhoE '[a-z-]+\.(js|css)\?v=[0-9a-f]+' site | sort -u
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
